services:
  app:
    image: ghcr.io/alexchiri/meetshare:latest
    env_file:
      - .env.meetshare
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - BASE_URL=https://meetshare.app
      - DB_PATH=/data/share-it.db
      - UPLOAD_DIR=/uploads
    volumes:
      - share-it-data:/data
      - share-it-uploads:/uploads
    # --- Hardening ---
    read_only: true                 # immutable root filesystem
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    cap_drop:
      - ALL                         # drop all Linux capabilities
    # NOTE: `no-new-privileges:true` is intentionally omitted — on this Ubuntu
    # host it conflicts with the docker-default AppArmor profile and makes the
    # entrypoint exec fail (EPERM). AppArmor + non-root `node` + cap_drop ALL
    # already block privilege escalation here.
    pids_limit: 256                 # cap process count (fork-bomb guard)
    mem_limit: 512m
    memswap_limit: 512m             # == mem_limit: disable swap usage
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  share-it-data:
  share-it-uploads:
